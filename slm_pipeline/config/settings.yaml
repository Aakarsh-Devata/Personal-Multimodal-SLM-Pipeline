paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  embeddings_dir: "data/embeddings"
  memory_dir: "data/memory"

models:
  whisper:
    backend: "whisper"
    name: "base"
    device: "cpu"
  vision:
    # A small local frame-observation model.  It is loaded only in phase 4 and
    # only from the local cache unless SLM_ALLOW_DOWNLOADS=1 is set explicitly.
    backend: "smolvlm2"
    name: "HuggingFaceTB/SmolVLM2-256M-Video-Instruct"
    device: "auto"
    batch_size: 1
    max_new_tokens: 64
  
  embeddings:
    name: "sentence-transformers/all-MiniLM-L6-v2"
    device: "cpu"
  
  slm:
    name: "mistral"
    backend: "ollama"
    temperature: 0.0
    max_tokens: 2000
  
  semantic_extraction:
    provider: "ollama"
    model: "mistral"
    temperature: 0.0
    max_tokens: 1500

pipeline:
  frame_sampling_fps: 1
  scene_threshold: 0.2
  time_window_sec: 2.0
  batch_size: 8
  skip_existing: false
  allow_model_downloads: false
  
vector_db:
  backend: "faiss"
  index_type: "IndexFlatL2"
  dimension: 384  # MiniLM embedding size
  
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
